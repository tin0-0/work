<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BK Autospares — Site Under Maintenance</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    color: #fff;
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 520px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    letter-spacing: 2px;
    color: #ffd400;
    margin-bottom: 8px;
  }
  .tag {
    font-size: 0.95rem;
    color: #999;
    margin-bottom: 32px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .wrench {
    font-size: 2.5rem;
    margin-bottom: 16px;
  }
  p {
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 28px;
    color: #ddd;
  }
  .contact {
    display: inline-block;
    background: #ffd400;
    color: #0d0d0d;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 4px;
    text-decoration: none;
    font-size: 1rem;
    transition: opacity 0.2s;
  }
  .contact:hover { opacity: 0.85; }
  .footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: #555;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="wrench">🔧</div>
    <h1>BK AUTOSPARES</h1>
    <div class="tag">Site Under Maintenance</div>
    <p>Our website is temporarily offline. For parts enquiries or to get the site restored, please get in touch directly.</p>
    <a class="contact" href="https://wa.me/YOUR_NUMBER_HERE" target="_blank">Contact Us on WhatsApp</a>
    <div class="footer">BK Autospares — back online shortly</div>
  </div>
</body>
</html>
